name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate build stamp
        id: stamp
        run: |
          STAMP=$(date +"%Y%m%d-%H%M%S")
          echo "stamp=$STAMP" >> $GITHUB_OUTPUT
          echo "Build stamp: $STAMP"
      
      - name: Inject build stamp into app.js
        run: |
          echo "window.__FTP_BUILD__ = '${{ steps.stamp.outputs.stamp }}';" > js/app.js.tmp
          cat js/app.js >> js/app.js.tmp
          mv js/app.js.tmp js/app.js
      
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
      
      - name: Deploy to FTP server with lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          # Create lftp script with environment variables expanded
          cat > /tmp/ftp-upload.sh << FTPEOF
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          
          open -u $FTP_USER,$FTP_PASSWORD $FTP_HOST
          
          # Create directories
          mkdir -p $FTP_REMOTE_DIR/css
          mkdir -p $FTP_REMOTE_DIR/js
          
          # Upload files
          put -O $FTP_REMOTE_DIR index.html
          put -O $FTP_REMOTE_DIR/css css/style.css
          put -O $FTP_REMOTE_DIR/js js/app.js
          
          bye
          FTPEOF
          
          echo "Starting FTP upload..."
          
          # Run lftp with the script
          lftp -f /tmp/ftp-upload.sh
          
          echo "✅ Upload complete!"
      
      - name: Deployment complete
        run: |
          echo "✅ Deployment successful!"
          echo "Build stamp: ${{ steps.stamp.outputs.stamp }}"
